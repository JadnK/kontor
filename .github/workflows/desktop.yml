name: Desktop (Windows, macOS, Linux)

# Baut die Desktop-App für alle Plattformen.
# - Push auf main / manueller Lauf: Installer als Build-Artefakte unter dem Workflow-Lauf
# - Tag v1.2.3:  GitHub-Release "Kontor v1.2.3" mit allen Installern (Version wird aus dem Tag übernommen)
#
#   Windows: Kontor_x.y.z_x64-setup.exe (NSIS), Kontor_x.y.z_x64_de-DE.msi, Kontor-portable.exe
#   macOS:   Kontor_x.y.z_universal.dmg (Intel + Apple Silicon)
#   Linux:   .deb, .rpm, .AppImage

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "apps/server/src/lib/calc.ts", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            name: linux
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/desktop
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = v;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = v;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").replace(/^version = ".*"$/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            console.log("Version", v);
          '

      - name: Abhängigkeiten
        working-directory: apps/desktop
        run: npm ci

      - name: Rechenlogik von App und Server identisch?
        shell: bash
        run: diff -u apps/server/src/lib/calc.ts apps/desktop/src/lib/calc.ts

      - name: Bauen (und bei Tag veröffentlichen)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Kontor ${{ github.ref_name }}"
          releaseBody: |
            **Windows:** `…_x64-setup.exe` installieren oder `Kontor-portable.exe` ohne Installation starten.
            **macOS:** `.dmg` öffnen und Kontor in „Programme“ ziehen. Beim ersten Start Rechtsklick → Öffnen (App ist nicht notarisiert).
            **Linux:** `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE) oder `.AppImage` (ausführbar machen und starten).

            Server-Image: `ghcr.io/${{ github.repository_owner }}/kontor-server:${{ github.ref_name }}`
          releaseDraft: false
          prerelease: false

      - name: Portable EXE
        if: matrix.name == 'windows'
        shell: bash
        run: cp apps/desktop/src-tauri/target/release/kontor.exe Kontor-portable.exe

      - name: Portable EXE zum Release hinzufügen
        if: matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kontor-portable.exe

      - name: Installer als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: kontor-${{ matrix.name }}
          if-no-files-found: error
          path: |
            Kontor-portable.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/kontor.example.json
